name: Release

# Запускается, когда ты пушишь тег вида v1.0.1 (это делает release.bat).
# Собирает Tangocho.exe (Windows) и Tangocho.apk (Android) и кладёт оба в один релиз.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version and notes from tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v','V')
          git fetch --force --tags | Out-Null
          $notes = git tag -l --format='%(contents)' $tag
          if (-not $notes) { $notes = "Версия $ver" }
          $notes | Out-File -Encoding utf8 notes.md
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Tangocho.exe
        shell: pwsh
        run: >
          dotnet publish Tangocho.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.meta.outputs.version }}
          -p:UpdateRepo=${{ github.repository }}
          -o out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Тангочо ${{ steps.meta.outputs.version }}
          body_path: notes.md
          files: out/Tangocho.exe

  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          # Кеш однажды сохранил «не найдено» для библиотек и ломал сборку — собираем начисто
          cache-disabled: true

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_B64. Добавь ключ подписи в Settings → Secrets and variables → Actions (см. README)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build Tangocho.apk
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gradle -p android assembleRelease --no-daemon --refresh-dependencies \
            -PappVersion="$VER" -PupdateRepo="${{ github.repository }}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Tangocho.apk

      - name: Add APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/Tangocho.apk
