<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Тангочо</title>
<style>
:root{--bg:#f2f3f6;--surface:#fff;--fg:#171a21;--muted:#676d7c;--line:#dcdfe7;--accent:#33508f;--err:#c4433b}
@media (prefers-color-scheme:dark){:root{--bg:#0c0e12;--surface:#15181f;--fg:#e8eaf0;--muted:#8b91a1;--line:#252a34;--accent:#9db1ea;--err:#ef6a61;color-scheme:dark}}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding-inline:16px}
.box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:44px;color:var(--accent)}
h1{font-size:22px;margin:0;font-weight:600}
p{margin:0;color:var(--muted)}
button,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.primary,a.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:disabled{opacity:.5}
svg{width:20px;height:20px}
.err{color:var(--err)}
</style>
</head>
<body>
<div class="box">
  <span class="jp">単</span>
  <h1 id="title">Вход в Тангочо</h1>
  <p id="text">Нажми кнопку и выбери аккаунт Google. Потом вернёшься в приложение.</p>
  <button id="go"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.3 14.6 2.3 12 2.3 6.6 2.3 2.3 6.6 2.3 12s4.3 9.7 9.7 9.7c5.6 0 9.3-3.9 9.3-9.5 0-.6-.1-1.1-.2-1.6H12z"/></svg>Войти через Google</button>
  <a class="btn primary" id="back" hidden>Вернуться в Тангочо</a>
  <p class="err" id="err" hidden></p>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const fail = t => { $("err").textContent = t; $("err").hidden = false; };

  // Куда вернуть токен: только в само приложение (ПК — локальный адрес, Android — tangocho://)
  let ret = new URLSearchParams(location.search).get("return") || "";
  try { if (ret) sessionStorage.setItem("ret", ret); else ret = sessionStorage.getItem("ret") || ""; } catch(e) {}
  const okRet = /^http:\/\/127\.0\.0\.1:\d{2,5}\/cb$/.test(ret) || ret === "tangocho://auth";
  if (!okRet) {
    $("text").textContent = "Эта страница открывается из приложения Тангочо, когда ты нажимаешь «Войти через Google».";
    $("go").hidden = true;
    return;
  }

  const C = window.TANGOCHO_CONFIG || {};
  if (!window.firebase || !C.firebase || !C.firebase.apiKey) { fail("Вход не настроен или нет интернета."); $("go").hidden = true; return; }
  firebase.initializeApp(C.firebase);

  function finish(idToken){
    const url = ret + "?idToken=" + encodeURIComponent(idToken);
    $("go").hidden = true;
    $("title").textContent = "Готово!";
    $("text").textContent = ret.startsWith("tangocho:") ? "Нажми кнопку, чтобы вернуться в приложение." : "Можно закрыть эту вкладку и вернуться в Тангочо.";
    $("back").href = url; $("back").hidden = false;
    try { sessionStorage.removeItem("ret"); } catch(e) {}
    location.href = url;
  }

  $("go").onclick = async () => {
    $("go").disabled = true; $("err").hidden = true;
    try {
      const p = new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: "select_account" });
      const r = await firebase.auth().signInWithPopup(p);
      const tok = r.credential && r.credential.idToken;
      if (!tok) throw new Error("Google не вернул токен");
      await firebase.auth().signOut();   // на этой странице аккаунт не нужен — только передать в приложение
      finish(tok);
    } catch (e) {
      $("go").disabled = false;
      fail(e.code === "auth/popup-closed-by-user" ? "Окно входа закрыто. Попробуй ещё раз." : ("Не получилось войти: " + (e.message || e)));
    }
  };
})();
</script>
</body>
</html>
